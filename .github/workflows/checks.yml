name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Native host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install host-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run host contract and failure tests
        run: python -m unittest discover -s tests -v
      - name: Verify public payload, source metadata and binary hashes
        run: python scripts/verify_release.py
      - name: Check Unix shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n bootstrap_unix.sh Setup-on-Linux.sh Setup-on-Mac.command scripts/check-fresh-bootstrap.sh
          for script in source/bridge/*.sh source/companion/*.sh source/companion/test/*.sh; do
            sh -n "$script"
          done
      - name: Test native Windows PowerShell 5.1 contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & tests/test-windows-bootstrap.ps1 -PythonExecutable (Get-Command python).Source
          & tests/test-windows-dependencies.ps1
      - name: Exercise fresh private Python and ADB downloads (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HIBREAK_RUNTIME_DIR: ${{ runner.temp }}/hibreak-fresh-runtime
        run: bash scripts/check-fresh-bootstrap.sh
      - name: Exercise fresh private Python and ADB downloads (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: '& scripts/check-fresh-bootstrap.ps1'

  android:
    name: Android compile, Java contracts, original signed payload and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install host-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install SDK-manager Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/hibreak-compile-sdk"
          tools_zip="$RUNNER_TEMP/hibreak-sdk-tools.zip"
          # Pin from https://developer.android.com/studio#command-line-tools-only
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$tools_zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $tools_zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          python -c 'print("y\n" * 100)' > "$RUNNER_TEMP/hibreak-sdk-acceptance.txt"
          "$manager" --sdk_root="$sdk_root" --licenses < "$RUNNER_TEMP/hibreak-sdk-acceptance.txt"
          "$manager" --sdk_root="$sdk_root" --install 'platforms;android-34' 'build-tools;35.0.1'
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Install compile JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production code and run Java host contracts
        shell: bash
        run: |
          set -euo pipefail
          sh source/bridge/build.sh
          sh source/bridge/test-host.sh
          sh source/companion/test/run-host-density-tests.sh
          sh source/companion/test/run-preparation-tests.sh
          sh source/companion/test/run-car-signal-tests.sh
          sh source/companion/build.sh
          sh source/companion/test/run-policy-rows-tests.sh
          sh source/companion/test/run-idle-updates-tests.sh
          sh source/companion/test/recovery/run.sh .
      - name: Verify original shipped APK signature and binary manifest
        shell: bash
        run: python scripts/verify_release.py --android-tools "$ANDROID_SDK_ROOT/build-tools/35.0.1"
      - name: Package original signed APK and prove deterministic ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py --output "$RUNNER_TEMP/release-one" --android-tools "$ANDROID_SDK_ROOT/build-tools/35.0.1"
          python scripts/package_release.py --output "$RUNNER_TEMP/release-two" --android-tools "$ANDROID_SDK_ROOT/build-tools/35.0.1"
          diff -r "$RUNNER_TEMP/release-one" "$RUNNER_TEMP/release-two"
      - name: Retain verified release candidates (never the local-key compile APK)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-original-signed-release-candidate
          path: ${{ runner.temp }}/release-one/*
          if-no-files-found: error
          retention-days: 14
